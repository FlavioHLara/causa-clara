server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O cliente chama /api na mesma origem e o nginx encaminha para a API.
    # Mesma origem significa nenhuma configuração de CORS para manter, e o
    # navegador trata tudo como um só site.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Sondas da API acessíveis pela mesma origem, úteis em diagnóstico.
    location /saude/ {
        proxy_pass       http://api:8080;
        proxy_set_header Host $host;
    }

    # Aplicação de página única: qualquer rota desconhecida devolve o index,
    # e o roteador do React resolve o caminho no cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os arquivos com hash no nome podem ser armazenados em cache indefinidamente;
    # o index.html, nunca, senão o navegador fica preso numa versão antiga.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
}
